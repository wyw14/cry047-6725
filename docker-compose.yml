services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
      POSTGRES_DB: maintenance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      HTTP_MODE: release
      USE_MEMORY_STORE: "false"
      DATABASE_URL: "postgres://maintenance:maintenance@db:5432/maintenance?sslmode=disable"
      STORAGE_ROOT: /app/var/attachments
      SCHEDULER_TICK: 1m
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      SEED_ON_START: "true"
    ports:
      - "8080:8080"
    volumes:
      - attachments:/app/var/attachments

  web:
    image: nginx:alpine
    depends_on:
      - server
    ports:
      - "5173:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  attachments:
